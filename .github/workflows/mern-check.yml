name: Portfolio quality checks

on:
  push:
    branches: [main, mern-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --prefix client --no-audit --no-fund

      - name: Install backend dependencies
        run: npm install --prefix server --no-audit --no-fund

      - name: Build React frontend
        run: npm run build --prefix client

      - name: Check Express API syntax
        run: node --check server/src/index.js
