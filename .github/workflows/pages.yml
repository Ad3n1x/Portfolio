name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --prefix client
      - name: Build frontend for GitHub Pages
        run: npm run build --prefix client
        env:
          GITHUB_PAGES: "true"
      - name: Validate GitHub Pages SEO artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("client/dist")
          required = ["index.html", "robots.txt", "sitemap.xml", "llms.txt", "project-pages.css",
                      "projects/quickcart/index.html", "projects/adverse/index.html",
                      "projects/unitrack/index.html", "projects/cuewise/index.html",
                      "projects/quiz-app/index.html"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"Missing Pages output files: {', '.join(missing)}")

          html = (root / "index.html").read_text(encoding="utf-8")
          robots = (root / "robots.txt").read_text(encoding="utf-8")
          llms = (root / "llms.txt").read_text(encoding="utf-8")
          sitemap = ET.parse(root / "sitemap.xml").getroot()

          canonical = "https://ad3n1x.github.io/Portfolio/"
          if canonical not in html:
              raise SystemExit("Canonical portfolio URL missing from built HTML")
          if f"Sitemap: {canonical}sitemap.xml" not in robots:
              raise SystemExit("robots.txt sitemap directive is missing or incorrect")
          if not any(node.text == canonical for node in sitemap.iter() if node.tag.endswith("loc")):
              raise SystemExit("sitemap.xml does not contain the canonical portfolio URL")
          if "AD3N1X" not in llms or "Adeniran Victor Adebowale" not in llms:
              raise SystemExit("llms.txt is missing the public identity association")

          expected_pages = [
              "projects/quickcart/", "projects/adverse/", "projects/unitrack/",
              "projects/cuewise/", "projects/quiz-app/"
          ]
          sitemap_urls = {node.text for node in sitemap.iter() if node.tag.endswith("loc")}
          for page in expected_pages:
              page_url = canonical + page
              if page_url not in sitemap_urls:
                  raise SystemExit(f"Sitemap is missing {page_url}")
              page_html = (root / page / "index.html").read_text(encoding="utf-8")
              if page_url not in page_html:
                  raise SystemExit(f"Canonical URL missing from {page}/index.html")
              if "<h1>" not in page_html or "<main" not in page_html:
                  raise SystemExit(f"Main content missing from {page}/index.html")

          print("SEO artifact validation passed: homepage, project pages, robots, sitemap, and llms.txt")
          PY
      - name: Support direct navigation
        run: cp client/dist/index.html client/dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
